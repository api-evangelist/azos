aid: azos
name: Azos
description: 'Azos is a Brazilian insurtech (founded 2021) that sells fully digital life insurance
  directly to consumers and through a broker (corretor) channel. Its products include life insurance,
  serious-illness coverage, accidental-disability coverage, and funeral assistance, all contracted
  online in minutes with no medical exam, transparent pricing from around R$5/month, and coverage up
  to R$1 million. The company positions itself as "seguro de vida sem burocracia" (life insurance
  without bureaucracy) and is backed by Prosus Ventures. Azos runs a consumer app and a broker portal
  but publishes no public developer API surface at this time.'
